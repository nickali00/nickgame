{% if session.get('codice_personale') %}
<details class="codice-personale" {% if request.endpoint == 'login' %}open{% endif %}>
    <summary>Mostra il mio codice personale</summary>
    <strong>{{ session['codice_personale'] }}</strong>
    <p>Conservalo: serve per accedere al tuo profilo. Non è il codice stanza e non va condiviso.</p>
</details>
{% endif %}
